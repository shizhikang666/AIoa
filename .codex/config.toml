# Project-local Codex configuration for OA-ThinkPHP.
# Keep this file free of API keys, passwords, tokens, and host-specific secrets.

[project]
name = "OA-ThinkPHP"
root = "F:\\AI\\projects\\testJava\\OA-ThinkPHP"
java_source = "F:\\AI\\projects\\testJava\\OA"

[safety]
