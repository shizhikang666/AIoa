name: baseline

# Baseline safety gate: PHP syntax + route table boot.
# Mirrors the local pre-commit hook (.githooks/pre-commit) and `composer check`
# so the same basic checks run in CI. See docs/tasks/regression-checklist.md.

on:
  push:
    branches:
      - refactor/thinkphp-main
      - 'refactor/**'
  pull_request:
    branches:
      - refactor/thinkphp-main

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Provide a default .env
        run: |
          if [ -f .example.env ] && [ ! -f .env ]; then cp .example.env .env; fi

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Baseline check (php-lint + route:list)
        run: composer check
